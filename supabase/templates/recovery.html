<h2>Reset your password</h2>
<p>Open the link below, then press the button on the page to choose a new password.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&email={{ .Email }}&next=%2Freset-password"
    >Reset your password</a
  >
</p>
<p>The link works once and expires in an hour. If you did not ask for this, ignore this message.</p>
